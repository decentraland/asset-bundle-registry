name: Publish 'latest' image

on:
  release:
    types:
      - "created"

# asset-bundle-registry-abgen is deliberately absent: the abgen lambda that feeds it only
# exists on the dev ops-lambdas stack. Deploy it to stg/prd through manual-deploy.yml until
# that changes.
jobs:
  prd-deployment:
    uses: decentraland/platform-actions/.github/workflows/apps-docker-release.yml@main
    with:
      service-name: asset-bundle-registry
      image-name: asset-bundle-registry
      deployment-environment: prd
    secrets: inherit

  stg-deployment:
    uses: decentraland/platform-actions/.github/workflows/apps-docker-release.yml@main
    with:
      service-name: asset-bundle-registry
      image-name: asset-bundle-registry
      deployment-environment: stg
    secrets: inherit
